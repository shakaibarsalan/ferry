[package]
name = "ferry"
version = "1.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
walkdir = "2"
tauri-plugin-dialog = "2"

# Cursor keeps its conversations in a SQLite file rather than in transcripts, so
# reading them means speaking SQLite. Bundled, because neither Windows nor macOS
# should depend on a system libsqlite3 being installed. About 1 MB.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
